<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeless Grass &amp; Greens</title>
<meta name="description" content="Timeless Grass &amp; Greens — new website coming soon.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Timeless Grass &amp; Greens">
<meta property="og:description" content="New website coming soon.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231d3b2a'/><path d='M50 78V38M50 44c0-10 8-18 18-18 0 10-8 18-18 18zM50 52c0-10-8-18-18-18 0 10 8 18 18 18z' stroke='%237fb069' stroke-width='7' stroke-linecap='round' fill='none'/></svg>">
<style>
  :root{
    --ink:#14251b;
    --green-deep:#1d3b2a;
    --green:#2f6b45;
    --green-bright:#7fb069;
    --paper:#f6f4ed;
    --muted:#5b6b60;
    --rule:rgba(29,59,42,.14);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    min-height:100svh;
    display:grid;
    grid-template-rows:1fr auto;
    background:
      radial-gradient(120% 90% at 50% 0%, #fffdf7 0%, var(--paper) 55%, #eae7dc 100%);
    color:var(--ink);
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  main{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:clamp(2rem,6vw,5rem) 1.25rem;
  }
  .mark{
    width:clamp(52px,9vw,72px);
    height:auto;
    margin-bottom:clamp(1.5rem,4vw,2.25rem);
  }
  h1{
    margin:0;
    font-family:ui-serif,Georgia,"Iowan Old Style","Times New Roman",serif;
    font-weight:600;
    font-size:clamp(2.1rem,7vw,4rem);
    line-height:1.06;
    letter-spacing:-.02em;
    color:var(--green-deep);
    text-wrap:balance;
  }
  h1 .amp{
    font-style:italic;
    font-weight:400;
    color:var(--green);
    padding:0 .06em;
  }
  .rule{
    width:clamp(56px,10vw,88px);
    height:2px;
    margin:clamp(1.5rem,4vw,2rem) 0;
    background:linear-gradient(90deg,transparent,var(--green-bright),transparent);
    border:0;
  }
  p.lede{
    margin:0;
    max-width:34ch;
    font-size:clamp(1rem,2.4vw,1.15rem);
    line-height:1.6;
    color:var(--muted);
    text-wrap:pretty;
  }
  .badge{
    margin-top:clamp(1.75rem,4vw,2.5rem);
    display:inline-flex;
    align-items:center;
    gap:.55rem;
    padding:.5rem .95rem;
    border:1px solid var(--rule);
    border-radius:999px;
    background:rgba(255,255,255,.6);
    font-size:.78rem;
    letter-spacing:.09em;
    text-transform:uppercase;
    font-weight:600;
    color:var(--green);
  }
  .badge::before{
    content:"";
    width:7px;height:7px;border-radius:50%;
    background:var(--green-bright);
    box-shadow:0 0 0 0 rgba(127,176,105,.7);
    animation:pulse 2.4s ease-out infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(127,176,105,.65)}
    70%{box-shadow:0 0 0 9px rgba(127,176,105,0)}
    100%{box-shadow:0 0 0 0 rgba(127,176,105,0)}
  }
  @media (prefers-reduced-motion:reduce){
    .badge::before{animation:none}
  }
  footer{
    padding:1.5rem 1.25rem 2rem;
    text-align:center;
    font-size:.8rem;
    color:var(--muted);
  }
  footer a{color:var(--green);text-decoration:none;border-bottom:1px solid var(--rule)}
  footer a:hover{border-bottom-color:var(--green)}
</style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 100 100" role="img" aria-label="Timeless Grass and Greens">
      <rect width="100" height="100" rx="22" fill="#1d3b2a"/>
      <g stroke="#7fb069" stroke-width="6.5" stroke-linecap="round" fill="none">
        <path d="M50 80V36"/>
        <path d="M50 44c0-10.5 8.5-19 19-19 0 10.5-8.5 19-19 19z"/>
        <path d="M50 56c0-10.5-8.5-19-19-19 0 10.5 8.5 19 19 19z"/>
      </g>
    </svg>

    <h1>Timeless Grass <span class="amp">&amp;</span> Greens</h1>

    <hr class="rule">

    <p class="lede">A new website is on the way. Check back soon.</p>

    <span class="badge">Coming Soon</span>
  </main>

  <footer>
    &copy; <span id="y">2026</span> Timeless Grass &amp; Greens &nbsp;·&nbsp;
    Site by <a href="https://tothemaxmedia.com" rel="noopener">To The Max Media</a>
  </footer>

  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
